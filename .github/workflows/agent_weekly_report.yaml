name: Agent Weekly Report

on:
  schedule:
    # Two UTC hours so it survives daylight saving. The script only runs at 8am New York.
    - cron: "0 12 * * 1"
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if it is not Monday 8am in New York (on-demand report)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  report:
    name: Build weekly report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PROFILES_TABLE: ${{ vars.PROFILES_TABLE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase

      - name: Build report
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python -m agent.weekly_report --force
          else
            python -m agent.weekly_report
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          if-no-files-found: ignore
          path: reports/
