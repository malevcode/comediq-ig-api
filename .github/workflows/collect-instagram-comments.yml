name: Collect Instagram Comments

on:
  workflow_dispatch:
    inputs:
      media_id:
        description: "Instagram Graph API media ID for the list post"
        required: true
        type: string
      graph_api_version:
        description: "Instagram Graph API version"
        required: false
        default: "v23.0"
        type: string
      max_pages:
        description: "Maximum comment pages to fetch"
        required: false
        default: "25"
        type: string
      include_existing_response_files:
        description: "Also process checked-out DM/SMS response files if present"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: instagram-comment-collection
  cancel-in-progress: false

jobs:
  collect-comments:
    name: Collect and process comments
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      IG_GRAPH_ACCESS_TOKEN: ${{ secrets.IG_GRAPH_ACCESS_TOKEN }}
      IG_GRAPH_API_VERSION: ${{ inputs.graph_api_version }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv pandas supabase

      - name: Validate required secrets
        run: |
          test -n "$IG_GRAPH_ACCESS_TOKEN" || (echo "Missing IG_GRAPH_ACCESS_TOKEN secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_KEY" || (echo "Missing SUPABASE_KEY secret" && exit 1)

      - name: Refresh mics export from Supabase
        run: |
          python export_monthly_verification_mics.py \
            --table open_mics_historical \
            --output monthly_verification_mics.csv \
            --json-output mics.json

      - name: Build username mapping from refreshed mics export
        run: |
          python prepare_instagram_comment_mapping.py monthly_verification_mics.csv \
            --mapping-output instagram_comment_mic_mapping.json \
            --review-csv-output instagram_comment_mic_mapping_review.csv

      - name: Collect comments and generate response outputs
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.include_existing_response_files }}" = "true" ]; then
            EXTRA_ARGS+=(--include-existing-response-files)
          fi

          python collect_instagram_comments.py \
            --media-id "${{ inputs.media_id }}" \
            --table-name open_mics_historical \
            --verification-column month_verification_status \
            --graph-version "${{ inputs.graph_api_version }}" \
            --max-pages "${{ inputs.max_pages }}" \
            --replace \
            "${EXTRA_ARGS[@]}"

      - name: Commit collected comment state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f instagram_comment_mic_mapping.json instagram_comment_mic_mapping_review.csv monthly_verification_mics.csv mics.json ig_comment_responses.json processed_responses.json ai_parse_queue.json ai_parse_results_template.json supabase_response_updates.sql
          git diff --cached --quiet || git commit -m "Update Instagram comment verification state"
          git push

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-comment-collection-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            instagram_comment_mic_mapping.json
            instagram_comment_mic_mapping_review.csv
            monthly_verification_mics.csv
            mics.json
            ig_comment_responses.json
            processed_responses.json
            ai_parse_queue.json
            ai_parse_results_template.json
            supabase_response_updates.sql
