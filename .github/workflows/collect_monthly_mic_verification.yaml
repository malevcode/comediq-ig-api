name: Collect Monthly Mic Verification Responses

on:
  workflow_dispatch:
    inputs:
      amount:
        description: "Recent Instagram DM threads to fetch"
        required: false
        default: "300"
        type: string
      missing_only:
        description: "Only collect handles that do not already have replies"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Preview target handles without logging into Instagram"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: instagram-monthly-verification-collect
  cancel-in-progress: false

jobs:
  collect-responses:
    name: Collect and process responses
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IG_USER: ${{ secrets.IG_USER }}
      IG_PASSWORD: ${{ secrets.IG_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv pandas instagrapi supabase

      - name: Validate send state and secrets
        run: |
          test -f ig_sent_messages.json || (echo "Missing ig_sent_messages.json. Run the real send workflow first." && exit 1)
          test -f ig_mic_mapping.json || (echo "Missing ig_mic_mapping.json. Run the real send workflow first." && exit 1)

          if [ "${{ inputs.dry_run }}" != "true" ]; then
            test -n "$IG_USER" || (echo "Missing IG_USER secret" && exit 1)
            test -n "$IG_PASSWORD" || (echo "Missing IG_PASSWORD secret" && exit 1)
          fi

      - name: Collect responses
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.missing_only }}" = "true" ]; then
            EXTRA_ARGS+=(--missing-only)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi

          python collect_instagram_responses.py \
            --amount "${{ inputs.amount }}" \
            "${EXTRA_ARGS[@]}"

      - name: Commit collected response state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dm_replies.json processed_responses.json ai_parse_queue.json ai_parse_results_template.json supabase_response_updates.sql
          git diff --cached --quiet || git commit -m "Update Instagram monthly verification response state"
          git push

      - name: Upload response artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-monthly-verification-collect-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            dm_replies.json
            processed_responses.json
            ai_parse_queue.json
            ai_parse_results_template.json
            supabase_response_updates.sql
